name: Editorial – conteúdo útil nas Páginas

on:
  workflow_dispatch:
  schedule:
    # 12:17 UTC ≈ 09:17 BRT — evita colisão com pipeline Shopee (minutos :07)
    - cron: "17 12 * * *"

concurrency:
  group: editorial-facebook-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Executar módulo editorial (publicação real)
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node editorial/pipeline.js

      - name: Persistir histórico editorial
        if: always()
        run: |
          if [ -f historico-editorial.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historico-editorial.json resultado-editorial.json 2>/dev/null || git add historico-editorial.json
            if git diff --staged --quiet; then
              echo "Histórico editorial sem alterações."
            else
              git commit -m "chore: atualiza historico-editorial.json"
              git push
              echo "Histórico editorial commitado."
            fi
          else
            echo "historico-editorial.json não encontrado."
          fi

      - name: Salvar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ github.run_id }}
          path: |
            historico-editorial.json
            resultado-editorial.json
            config/editorial.json
          retention-days: 14
