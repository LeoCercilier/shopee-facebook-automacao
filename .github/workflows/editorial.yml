name: Editorial RSS – conteúdo útil nas Páginas

on:
  workflow_dispatch:

  schedule:
    - cron: "47 12 * * *"

concurrency:
  group: editorial-facebook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Executar editorial
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node editorial/pipeline.js

      - name: Persistir resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resultado-editorial.json historico-editorial.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Sem alterações para salvar."
          else
            git commit -m "chore: atualiza editorial"
            git push
          fi

      - name: Artefato do editorial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ github.run_id }}
          path: |
            resultado-editorial.json
            historico-editorial.json
          retention-days: 14
          if-no-files-found: ignore
