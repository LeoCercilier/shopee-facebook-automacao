name: Coletar oferta automaticamente

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Coletar oferta
        run: npm start

      - name: Salvar resultado
        uses: actions/upload-artifact@v4
        with:
          name: oferta-coletada
          path: resultado-oferta.json
