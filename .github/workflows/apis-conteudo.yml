name: APIs – conteúdo útil nas Páginas

on:
  workflow_dispatch:
  schedule:
    # 13:27 UTC ≈ 10:27 BRT — evita colisão com Shopee (:07) e antigo editorial (:17)
    - cron: "27 13 * * *"

concurrency:
  group: apis-conteudo-facebook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apis-conteudo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Executar pipeline de APIs (publicação real)
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node api-conteudo/pipeline.js

      - name: Persistir histórico API
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico-api.json resultado-api-conteudo.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sem alterações no histórico."
          else
            git commit -m "chore: atualiza historico-api.json"
            git push
            echo "Histórico API commitado."
          fi

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apis-conteudo-${{ github.run_id }}
          path: |
            historico-api.json
            resultado-api-conteudo.json
            config/apis-conteudo.json
          retention-days: 14
