name: APIs – conteúdo útil nas Páginas

on:
  workflow_dispatch:
  schedule:
    # 13:27 UTC ≈ 10:27 BRT
    - cron: "27 13 * * *"

concurrency:
  group: apis-conteudo-facebook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apis-conteudo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Curadoria e publicação real nas Páginas
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          # Publicação real (posts de API sem link externo; só Shopee usa link de produto)
          PUBLICAR_API: "true"
        run: node api-conteudo/pipeline.js

      - name: Persistir candidatos e histórico
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultado-api-candidatos.json resultado-api-conteudo.json historico-api.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sem alterações."
          else
            git commit -m "chore: atualiza histórico/candidatos api-conteudo"
            git push
          fi

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apis-candidatos-${{ github.run_id }}
          path: |
            resultado-api-candidatos.json
            resultado-api-conteudo.json
            historico-api.json
            config/apis-conteudo.json
          retention-days: 14
